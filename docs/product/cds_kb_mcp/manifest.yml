---
# SAP BTP Cloud Foundry manifest for cds-kb-mcp v2 (Streamable HTTP only).
#
# cf push from docs/product/cds_kb_mcp:
#   cf api https://api.cf.<region>.hana.ondemand.com
#   cf login
#   cf push
#
# The BTP app has no local cds_kb_data tree, so it loads index/views from the
# monorepo's own GitHub remote (public repo, no PAT needed — see CDS_KB_REMOTE
# below). Optional env (set with `cf set-env cds-kb-mcp KEY VALUE` before
# cf push, or via the BTP cockpit): API_KEY / CDS_KB_OAUTH_SECRET (+
# CDS_KB_OAUTH_CLIENT_ID, CDS_KB_PUBLIC_URL) / CDS_KB_JWKS_URL / CDS_KB_S3_* /
# CDS_KB_USAGE_ENDPOINT (CDS_KB_EMBED_API_KEY optional — hybrid search is keyless). See README.md.
applications:
  - name: cds-kb-mcp
    memory: 4G   # org trial quota max (4G total org-wide) — leaves zero headroom for any other
                 # app/service in this org/space. 512M OOM-crashed every ~15min on periodic index
                 # refresh (CDS_KB_INDEX_REFRESH_MINUTES); 256M OOM-crashed just loading the
                 # ~10.6k-view MiniSearch index (both verified on BTP trial)
    instances: 1
    # v2.4.0 needs 2G disk: @huggingface/transformers (+ onnxruntime) and sharp
    # in node_modules plus the index/embeddings cache exceed the 1G default
    # (the app crashed with ENOSPC at startup on 1G).
    disk_quota: 2G
    buildpacks:
      - nodejs_buildpack
    # Runs the pre-built bundle, NOT `npm start` (= node src/server.mjs) — the
    # raw src imports a sibling ../../cds_kb_data/scripts/lib/query-compose.mjs
    # that only exists in the local harness monorepo layout. `cf push` only
    # uploads this app directory, so that import 404s at runtime on BTP. The
    # bundle (npm run build) inlines it via esbuild, so it's self-contained.
    command: node dist/cds-kb-mcp.cjs
    timeout: 180
    services:
      # BTP-native log drain — CF's own log buffer is short-lived and has no
      # persistence, so a crash's stdout/stderr is gone once it rotates out
      # (lost exactly this way once already). Create once with:
      #   cf create-service application-logs lite cds-kb-mcp-logs
      - cds-kb-mcp-logs
    env:
      # PORT (auto-set by CF) switches the server to HTTP mode; the only
      # HTTP transport in v2 is Streamable HTTP at /mcp (SSE was removed with
      # the MCP SDK v2 upgrade). USE_SSE was a v1-era no-op — dropped.
      CDS_KB_REMOTE: https://raw.githubusercontent.com/StormShynn/cds-kb-mcp-data-kit/main/docs/product/cds_kb_data
      CDS_KB_INDEX_REFRESH_MINUTES: "15"
      # The domain-proxy Worker in front of this app is a pure passthrough (no
      # x-forwarded-* headers, Host rewritten to the raw BTP route) — without this,
      # issuerOf() falls back to that internal cfapps.*.hana.ondemand.com route,
      # which breaks /openapi.json's "servers[].url" for Swagger UI's "Try it out"
      # (mixed content / CORS calling out from the mcp.tringhia.io.vn page). Also
      # doubles as the OAuth issuer (oauth.mjs) if CDS_KB_OAUTH_SECRET is ever set.
      CDS_KB_PUBLIC_URL: https://mcp.tringhia.io.vn
      # Usage collector /ping (NOT bare origin — the worker only accepts
      # pings at /ping; a future `cf push` would silently kill telemetry if
      # this lacks the suffix).
      CDS_KB_USAGE_ENDPOINT: https://cds-kb-usage-collector.chinghia190399.workers.dev/ping
      # CDS_KB_DATA_TOKEN: "github-fine-grained-pat"   # Only needed if cds-kb-mcp-data-kit ever goes private
      # API_KEY: "your-secret-key-here"                # Optional auth
      # CDS_KB_OAUTH_SECRET: "a-32-char-min-secret-for-oauth-2-1"  # Optional OAuth 2.1
