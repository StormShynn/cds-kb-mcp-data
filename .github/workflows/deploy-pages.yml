# .github/workflows/deploy-pages.yml
# Publish overview.html (and everything it embeds) to GitHub Pages at
# https://stormshynn.github.io/cds-kb-mcp-data/ (repo was renamed from
# cds-kb-mcp-data-kit to cds-kb-mcp-data — GitHub Pages follows the current
# repo name automatically, this comment just needs to stay in sync).
#
# Pages content lives at docs/product/cds_kb_data/, two folders deeper than
# this repo's root — the branch-based Pages source setting can only point at
# `/` or `/docs`, neither of which matches, so this repo's Pages was 404ing
# despite being enabled. actions/upload-pages-artifact sidesteps that: it
# uploads whatever directory this workflow hands it, regardless of where
# that directory sits in the repo.
#
# search.html and field-search.html aren't regenerated by any other workflow
# (only enrich_index.mjs's index/*.json outputs are, via resync-folders.yml)
# — they'd silently go stale as views/ changes otherwise. dashboard.html has
# its own scheduled rebuild (update-dashboard.yml) but regenerating it here
# too is free (pure local render from changelog.json, no network). So this
# workflow rebuilds those fresh from whatever's already committed to main,
# right before every deploy — no separate staleness problem to track.
# coverage-report.html is the one exception: it needs a live SAP Hub fetch to
# regenerate, which check-coverage.yml already keeps fresh on its own
# 6-hourly schedule, so this workflow just uses main's already-committed copy
# as-is — same reasoning now applies to query-builder.html (see below).
#
# query-builder.html is DELIBERATELY NOT regenerated here, unlike the other
# three. scripts/generate-query-builder.mjs has fallen behind ~838 lines of
# features that were hand-edited straight into query-builder.html over
# several commits (multi-view JOIN, "declare new association" toggle, raw
# ABAP-note saving, Generate JSON/Share link) without the generator being
# updated to match — exactly the failure mode the file's own header comment
# warns about ("a hand-added output tab was lost that way once"), just at
# larger scale. Running `npm run generate-query-builder` here was silently
# overwriting every one of those features on every single deploy, so the
# live site never actually showed what was checked into git. Until someone
# ports that drift back into the generator script (the correct long-term
# fix — see the file's header comment), this workflow copies the
# already-committed query-builder.html as-is, matching coverage-report.html's
# pattern.
#
# Triggered via workflow_run (not a plain `on: push` to the generated files)
# because check-coverage.yml/sync-view-metadata.yml push straight to main
# using an admin PAT / the default GITHUB_TOKEN — and pushes made with an
# Actions-issued token deliberately don't fire other `on: push` workflows
# (GitHub's own loop-prevention), so a push-based trigger here would just
# never run. workflow_run isn't subject to that restriction.
#
# The workflow_run list below matches by NAME (the `name:` field of the
# source workflow, not its filename) — update-dashboard.yml and
# resync-folders.yml were merged into sync-view-metadata.yml on 2026-09-30;
# if that workflow's `name:` ever changes again, update this list too, or
# Pages silently stops redeploying on that trigger.

name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Check Hub Coverage
      - Sync View Metadata
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/product/cds_kb_data/overview.html'
      - 'docs/product/cds_kb_data/dashboard.html'
      - 'docs/product/cds_kb_data/coverage-report.html'
      - 'docs/product/cds_kb_data/query-builder.html'
      - 'docs/product/cds_kb_data/tools.html'
      - 'docs/product/cds_kb_data/index/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild dashboard, search, and field-search pages
        run: |
          npm run generate-dashboard
          npm run generate-search-page
          npm run generate-field-search

      - name: Assemble Pages site
        run: |
          SITE=$(mktemp -d)
          cp overview.html "$SITE/index.html"
          cp dashboard.html coverage-report.html search.html field-search.html query-builder.html tools.html "$SITE/"
          mkdir -p "$SITE/index"
          cp index/view-fields.js "$SITE/index/"
          # query-builder.html embeds only the featured entries and fetches the
          # full library at runtime, so these two must ship with the site or the
          # "Saved queries" list silently stays at the featured bootstrap.
          cp index/query-library.json index/query-library-index.json "$SITE/index/"
          echo "SITE_DIR=$SITE" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
