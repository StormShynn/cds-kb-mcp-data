# .github/workflows/build-embeddings.yml
# Build index/embeddings.json (view semantic_en/description vectors) so
# cds-kb-mcp's search_mode=hybrid can re-rank BM25 with cosine similarity
# (see scripts/build-embeddings.mjs and the server's rankedSearch).
#
# No API key needed anymore: build-embeddings.mjs now falls back to a LOCAL
# ONNX model via transformers.js (all-MiniLM-L6-v2) when CDS_KB_EMBED_API_KEY
# is unset — hybrid search is free and keyless. A remote OpenAI-compatible
# key (when set) still overrides with a stronger model.
#
# The vector file is derived from the tracked view frontmatter and stored in
# git (like search_index.json), not regenerated on the fly, so a fresh clone
# or BTP restart never needs the API key or a model download — only refresh
# runs do (the transformers.js model is cached between runs below).

name: Build Embeddings

on:
  schedule:
    # Weekly, Sunday 06:00 UTC — off the other bots' daily schedules so the
    # commit never races daily-fetch/enrich-descriptions.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Views to embed this run (0 = all)'
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: build-embeddings
  cancel-in-progress: false

jobs:
  build-embeddings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # transformers.js downloads the ONNX model (~90 MB) on first run; cache
      # it across weekly runs so embedding doesn't re-fetch every time.
      - name: Cache local embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: transformersjs-embeddings-${{ runner.os }}
          restore-keys: |
            transformersjs-embeddings-${{ runner.os }}

      - name: Build embeddings
        env:
          CDS_KB_EMBED_API_KEY: ${{ secrets.CDS_KB_EMBED_API_KEY }}
          CDS_KB_EMBED_URL: ${{ secrets.CDS_KB_EMBED_URL }}
          CDS_KB_EMBED_MODEL: ${{ secrets.CDS_KB_EMBED_MODEL }}
        run: |
          ARGS=(.)
          if [ -n "${{ github.event.inputs.limit }}" ] && [ "${{ github.event.inputs.limit }}" != "0" ]; then
            ARGS+=(--limit ${{ github.event.inputs.limit }})
          fi
          node scripts/build-embeddings.mjs "${ARGS[@]}"

      - name: Commit and push if changed
        uses: ./.github/actions/commit-and-push
        with:
          paths: docs/product/cds_kb_data/index/embeddings.json
          commit-message: "Build embeddings [skip ci]"
          empty-message: Embeddings unchanged
          success-message: Embeddings updated