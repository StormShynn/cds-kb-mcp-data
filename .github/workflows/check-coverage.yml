# .github/workflows/check-coverage.yml
# Keep coverage-report.html in sync with the live SAP Business Accelerator
# Hub CDS View catalog.
#
# This only compares data — it never writes to views/, so unlike
# daily-fetch.yml it pushes the report straight to main without a PR.
#
# This repo is private, so there is deliberately no GitHub Pages deploy step
# here (see update-dashboard.yml for why).
#
# Direct-to-main push needs an admin PAT: branch protection on main requires
# the data-test + mcp-test status checks, and the default GITHUB_TOKEN (the
# github-actions[bot] identity) has no bypass rights for that — every run
# failed with "protected branch update failed ... 2 of 2 required status
# checks are expected" (confirmed failing on every run from ~2026-09-16
# through 2026-09-30). main has `enforce_admins: false`, so a push
# authenticated as a repo admin/owner bypasses the requirement instead.
# HUB_COVERAGE_PAT is a classic PAT (repo scope) or fine-grained PAT
# (Contents: write on this repo) from an admin/owner account, added once as
# a repository secret (Settings -> Secrets and variables -> Actions).

name: Check Hub Coverage

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/product/cds_kb_data/views/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The CDS KB project lives under this subpath now (moved out of the
        # repo root to make room for other, unrelated project material) —
        # every `run:` step below resolves relative paths (package.json,
        # scripts/, views/) against it. `uses:` steps (checkout, setup-node,
        # the commit-and-push composite action) are NOT affected by this —
        # they still operate from the repo root, which is why the
        # commit-and-push step's `paths:` input below is prefixed by hand.
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Falls back to the default GITHUB_TOKEN (github-actions[bot]) if
          # HUB_COVERAGE_PAT isn't configured yet — same behavior as before
          # this fix (push still fails against branch protection until the
          # secret is added; nothing regresses by leaving it unset).
          token: ${{ secrets.HUB_COVERAGE_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check coverage against the Hub catalog
        env:
          # Optional — every call this script makes already works unauthenticated
          # (see scripts/check-coverage.mjs). Only takes effect if this repo has
          # a SAP_API_HUB_KEY secret configured; a fallback, not a requirement.
          SAP_API_HUB_KEY: ${{ secrets.SAP_API_HUB_KEY }}
        run: node scripts/check-coverage.mjs

      - name: Flag locally-released views not on the Hub's current list
        run: node scripts/flag-release-state-review.mjs

      - name: Commit and push if changed
        uses: ./.github/actions/commit-and-push
        with:
          paths: docs/product/cds_kb_data/coverage.json docs/product/cds_kb_data/coverage-report.html docs/product/cds_kb_data/release-state-review.json
          commit-message: "Update Hub coverage report [skip ci]"
          empty-message: Coverage unchanged
          success-message: Coverage report updated
