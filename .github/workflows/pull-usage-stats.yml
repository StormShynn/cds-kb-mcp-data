# .github/workflows/pull-usage-stats.yml
# Pull aggregated CDS-view usage counts from the usage-collector Worker
# (cds-kb-mcp-kit's worker/ — every running MCP server instance pings it on
# each get_cds_view call) and rebuild the search index so popular views
# rank higher in search_cds (see scripts/pull-usage-stats.mjs and
# enrich_index.mjs's usageCount field).
#
# No-op if the two secrets below aren't set — pull-usage-stats.mjs treats a
# missing CDS_KB_USAGE_ENDPOINT as "telemetry not configured yet", not an
# error, so this workflow is safe to merge before the Worker is deployed.

name: Pull Usage Stats

on:
  schedule:
    # Daily at 5:00 AM UTC (offset from the other bots' schedules)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-usage-stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The CDS KB project lives under this subpath now — see
        # check-coverage.yml's comment for the full rationale.
        working-directory: docs/product/cds_kb_data

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # See check-coverage.yml's header comment: main's branch protection
          # (data-test + mcp-test required) blocks a direct push authenticated
          # with the default GITHUB_TOKEN. Falls back to GITHUB_TOKEN (same
          # failure as before) if HUB_COVERAGE_PAT isn't configured yet.
          token: ${{ secrets.HUB_COVERAGE_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/product/cds_kb_data/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pull usage stats from the collector
        env:
          CDS_KB_USAGE_ENDPOINT: ${{ secrets.CDS_KB_USAGE_ENDPOINT }}
          CDS_KB_USAGE_PULL_TOKEN: ${{ secrets.CDS_KB_USAGE_PULL_TOKEN }}
        run: node scripts/pull-usage-stats.mjs

      - name: Rebuild search index with fresh usage counts
        run: npm run rebuild-index

      - name: Commit and push if changed
        uses: ./.github/actions/commit-and-push
        with:
          paths: docs/product/cds_kb_data/index/usage-stats.json docs/product/cds_kb_data/index/search_index.json docs/product/cds_kb_data/index/version.json
          commit-message: "Pull usage stats [skip ci]"
          empty-message: Usage stats unchanged
          success-message: Usage stats updated
